name: Release-plz

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only validation is the only authorized mode in this rollout
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]
      source_sha:
        description: Full SHA of the landed candidate to validate
        required: true
        type: string
      candidate_run_id:
        description: CI run ID for the exact candidate push
        required: true
        type: string
      candidate_run_attempt:
        description: Attempt number for the candidate CI run
        required: true
        default: '1'
        type: string
      release_set:
        description: JSON array of crates in the approved release order
        required: true
        type: string

permissions: {}

concurrency:
  group: organization-crates-release
  cancel-in-progress: false

jobs:
  verify-inputs:
    name: Verify landed candidate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source ancestry and exact candidate check
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          RELEASE_SET: ${{ inputs.release_set }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_sha must be a full SHA' >&2; exit 1; }
          [[ "$SOURCE_SHA" == "$(git rev-parse HEAD)" ]] || { echo 'dispatch must run at the exact landed source SHA' >&2; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || { echo 'source_sha is not an ancestor of remote main' >&2; exit 1; }
          jq -e 'type == "array" and length > 0' <<<"$RELEASE_SET" >/dev/null || { echo 'release_set must be a non-empty JSON array' >&2; exit 1; }
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}")"
          jq -e --arg sha "$SOURCE_SHA" --arg attempt "$CANDIDATE_RUN_ATTEMPT" '
            .path == ".github/workflows/ci.yml" and .event == "push" and
            (.head_branch | startswith("delta/verify/")) and .head_sha == $sha and
            .status == "completed" and .conclusion == "success" and
            (.run_attempt | tostring) == $attempt
          ' <<<"$run_json" >/dev/null || { echo 'candidate CI run metadata does not match' >&2; exit 1; }
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}/jobs")"
          jq -e '.jobs | any(.[]; .name == "check" and .conclusion == "success")' <<<"$jobs_json" >/dev/null || { echo 'candidate check job did not succeed' >&2; exit 1; }
          echo "Verified landed source $SOURCE_SHA and candidate run $CANDIDATE_RUN_ID attempt $CANDIDATE_RUN_ATTEMPT."

  dry-run:
    name: Release dry-run
    needs: verify-inputs
    if: ${{ inputs.mode == 'dry-run' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Validate the release without publishing
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish crates (separately authorized)
    needs: verify-inputs
    if: ${{ inputs.mode == 'publish' && github.ref == 'refs/heads/main' && inputs.release_set != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: 1.94.0
      - name: Publish unpublished crates
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
